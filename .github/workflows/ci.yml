name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # release.yml runs this first and only publishes if it passes.
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install libomp

    - name: Every internal import resolves
      run: python scripts/check_imports.py src langtune

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest

    - name: Package imports
      run: python -c "import langtune; print('langtune', langtune.__version__)"

    - name: API contract and TRL compatibility tests
      run: pytest -q tests/test_api_contract.py tests/test_trl_compat.py

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Build and check the distribution
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check dist/*
